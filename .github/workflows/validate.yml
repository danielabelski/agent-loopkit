name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyyaml pytest

      - name: Run repo structure validator
        run: python scripts/validate_repo.py

      - name: Run recipe validator (all recipes)
        run: python scripts/validate_recipe.py --all

      - name: Run pytest
        run: python -m pytest -v

      - name: Secret scan (defense in depth)
        run: |
          set -e
          if grep -rE 'ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|sk-proj-[A-Za-z0-9]{20,}|xox[abprs]-[A-Za-z0-9-]{10,}|EAA[A-Za-z0-9]{50,}' \
              --exclude-dir=.git \
              --exclude-dir=.github \
              --exclude=*.png \
              . ; then
            echo "ERROR: Real secret pattern found in repo" >&2
            exit 1
          fi
          echo "Secret scan: clean"