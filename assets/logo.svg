<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="agent-loopkit logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Loop arrow -->
  <g transform="translate(128, 128)">
    <path d="M -52 -10 A 52 52 0 1 1 32 42"
          fill="none"
          stroke="url(#loop)"
          stroke-width="14"
          stroke-linecap="round"/>
    <path d="M 22 22 L 34 42 L 16 52 Z" fill="#67e8f9"/>

    <!-- Kit accent -->
    <rect x="-12" y="-4" width="26" height="20" rx="3"
          fill="none" stroke="#fbbf24" stroke-width="3"/>
    <path d="M -4 -4 L 0 -12 L 10 -12 L 14 -4"
          fill="none" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>