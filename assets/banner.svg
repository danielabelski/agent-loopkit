<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="agent-loopkit — reusable playbooks for autonomous AI agent loops">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Decorative flow nodes (loop pattern across banner) -->
  <g opacity="0.35" stroke="#22d3ee" stroke-width="1" fill="#0a0e1a">
    <circle cx="60"   cy="80"  r="4"/>
    <circle cx="160"  cy="60"  r="3"/>
    <circle cx="260"  cy="90"  r="4"/>
    <circle cx="360"  cy="70"  r="3"/>
    <circle cx="900"  cy="70"  r="3"/>
    <circle cx="1000" cy="90"  r="4"/>
    <circle cx="1100" cy="60"  r="3"/>
    <circle cx="1200" cy="80"  r="4"/>
    <line x1="60"  y1="80"  x2="160" y2="60"/>
    <line x1="160" y1="60"  x2="260" y2="90"/>
    <line x1="260" y1="90"  x2="360" y2="70"/>
    <line x1="900" y1="70"  x2="1000" y2="90"/>
    <line x1="1000" y1="90" x2="1100" y2="60"/>
    <line x1="1100" y1="60" x2="1200" y2="80"/>
  </g>

  <!-- Decorative bottom flow -->
  <g opacity="0.25" stroke="#fbbf24" stroke-width="1" fill="#0a0e1a">
    <circle cx="80"   cy="240" r="3"/>
    <circle cx="200"  cy="260" r="4"/>
    <circle cx="320"  cy="240" r="3"/>
    <circle cx="440"  cy="260" r="4"/>
    <circle cx="840"  cy="260" r="4"/>
    <circle cx="960"  cy="240" r="3"/>
    <circle cx="1080" cy="260" r="4"/>
    <circle cx="1200" cy="240" r="3"/>
    <line x1="80"   y1="240" x2="200" y2="260"/>
    <line x1="200"  y1="260" x2="320" y2="240"/>
    <line x1="320"  y1="240" x2="440" y2="260"/>
    <line x1="840"  y1="260" x2="960" y2="240"/>
    <line x1="960"  y1="240" x2="1080" y2="260"/>
    <line x1="1080" y1="260" x2="1200" y2="240"/>
  </g>

  <!-- Logo mark: stylized loop arrow + tool/kit -->
  <g transform="translate(180, 160)" filter="url(#glow)">
    <!-- Outer loop arrow -->
    <path d="M -50 -10 A 50 50 0 1 1 30 38"
          fill="none"
          stroke="url(#loop)"
          stroke-width="10"
          stroke-linecap="round"/>
    <!-- Arrow head -->
    <path d="M 22 22 L 32 38 L 18 48 Z" fill="#22d3ee"/>
    <!-- Kit/toolbox accent (small) -->
    <rect x="-8" y="-2" width="20" height="14" rx="2"
          fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path d="M -2 -2 L 2 -8 L 8 -8 L 12 -2"
          fill="none" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <!-- Title -->
  <text x="290" y="150"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="56"
        font-weight="700"
        fill="#f8fafc"
        letter-spacing="-1.5">agent-loopkit</text>

  <!-- Tagline -->
  <text x="292" y="195"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="20"
        font-weight="400"
        fill="#94a3b8">reusable playbooks for autonomous AI agent loops</text>

  <!-- Bottom-left badge -->
  <g transform="translate(60, 280)">
    <rect width="180" height="22" rx="11" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <circle cx="14" cy="11" r="4" fill="#22d3ee"/>
    <text x="26" y="15"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12"
          font-weight="500"
          fill="#e5e7eb">copy · customize · ship</text>
  </g>

  <!-- Bottom-right version -->
  <text x="1220" y="295"
        text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="12"
        font-weight="500"
        fill="#64748b">v0.1.0</text>
</svg>